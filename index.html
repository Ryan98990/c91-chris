<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>꧁༺𖤍𓊈𝒞91_𝒞𝒽𝓇𝒾𝓈𓊉𖤍༻꧂</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --glass: rgba(255,255,255,.16);
  --glass-border: rgba(255,255,255,.25);
  --glow:
    0 0 10px rgba(255,255,255,.9),
    0 0 22px rgba(255,255,255,.55);
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100vh;
  overflow: hidden;

  font-family: "Segoe UI", Arial, sans-serif;
  color: #fff;

  background:
    linear-gradient(rgba(0,0,0,.32), rgba(0,0,0,.32)),
    url("background.gif") center / cover no-repeat fixed;

  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;

  background: rgba(0,0,0,.05);

  backdrop-filter: blur(.5px);
  -webkit-backdrop-filter: blur(1.4px) grayscale(.25);

  z-index: 0;
}

img {
  pointer-events: none;
  -webkit-user-drag: none;
}

/* =========================
   雪花
========================= */

#snow {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* =========================
   进入页面
========================= */

.enter {
  position: fixed;
  inset: 0;

  z-index: 99;

  display: grid;
  place-items: center;

  background: rgba(0,0,0,.92);

  cursor: pointer;

  transition:
    opacity .7s ease,
    visibility .7s ease;
}

.enter h2 {
  margin: 0;

  font-size: clamp(22px, 5vw, 36px);
  letter-spacing: 4px;

  font-family: Georgia, serif;
  font-style: italic;

  text-shadow: var(--glow);

  animation: pulse 1.7s ease-in-out infinite;
}

.enter.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* =========================
   主容器
========================= */

.wrap {
  position: relative;

  z-index: 2;

  min-height: 100vh;

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 18px;

  padding: 22px;
}

/* =========================
   个人资料卡
========================= */

.card {
  width: min(92vw, 650px);

  padding: 38px 34px 26px;

  border-radius: 30px;

  text-align: center;

  background: rgba(255,255,255,0.06);

  border: 1.5px solid rgba(255,255,255,0.25);

  box-shadow:
    0 0 25px rgba(255,255,255,0.08),
    inset 0 0 20px rgba(255,255,255,0.03);

  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);

  animation: rise .9s ease both;
}

/* =========================
   大头像
========================= */

.avatar {
  width: 124px;
  height: 124px;

  margin: 0 auto 14px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 40% 30%,
      rgba(165,70,255,.85),
      transparent 24%
    ),
    linear-gradient(135deg, #050505, #4b4b4b);

  border: 4px solid rgba(255,255,255,.65);

  box-shadow:
    0 0 28px rgba(255,255,255,.65);

  display: grid;
  place-items: center;

  position: relative;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  border-radius: 50%;
}

/* =========================
   名字
========================= */

h1 {
  margin: 0;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-style: italic;

  font-size: clamp(15px, 2.2vw, 22px);

  letter-spacing: .5px;

  line-height: 1.15;

  text-shadow: var(--glow);

  word-break: keep-all;
}

.divider {
  font-size: 26px;

  margin: 14px 0 18px;

  color: #fff;

  filter:
    drop-shadow(0 0 10px white)
    drop-shadow(0 0 20px #b300ff);
}

.title {
  margin: 0 0 18px;

  font-size: 20px;

  font-weight: 800;

  text-shadow:
    0 0 10px rgba(0,0,0,.45);
}

/* =========================
   Discord 状态
========================= */

.status-card {
  width: fit-content;

  max-width: 340px;

  margin: 0 auto 26px;

  padding: 13px 18px;

  display: flex;

  align-items: center;

  gap: 12px;

  background:
    rgba(255,255,255,0.08);

  border:
    1px solid rgba(255,255,255,0.20);

  border-radius: 22px;

  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);

  transition: .25s ease;
}

.status-card:hover {
  border-color:
    rgba(255,255,255,0.35);

  box-shadow:
    0 0 20px rgba(255,255,255,0.10);
}

.mini-avatar {
  width: 58px;
  height: 58px;

  border-radius: 50%;

  flex: 0 0 auto;

  background:
    radial-gradient(
      circle at 40% 35%,
      #444,
      #050505 70%
    );

  display: grid;
  place-items: center;

  position: relative;
}

.mini-avatar img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  border-radius: 50%;
}

/* 在线绿点 */

.mini-avatar::after {
  content: "";

  position: absolute;

  right: 1px;
  bottom: 1px;

  width: 17px;
  height: 17px;

  border-radius: 50%;

  background: #20d66f;

  border:
    2px solid rgba(255,255,255,.8);
}

.status-text {
  text-align: left;

  line-height: 1.28;

  min-width: 0;
}

.status-text b {
  display: block;

  font-size: 12px;

  word-break: break-all;

  margin-bottom: 4px;
}

.status-text span {
  display: block;

  font-size: 13px;

  opacity: .92;
}

/* =========================
   社交媒体
========================= */

.socials {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 14px;

  flex-wrap: wrap;

  margin-bottom: 23px;
}

.socials a {
  width: 30px;
  height: 30px;

  display: grid;

  place-items: center;

  color: #fff;

  text-decoration: none;

  filter:
    drop-shadow(
      0 0 8px rgba(255,255,255,.9)
    );

  transition: .2s ease;
}

.socials a:hover {
  transform:
    translateY(-4px)
    scale(1.14);
}

.socials svg {
  width: 27px;
  height: 27px;

  fill: currentColor;
}

/* =========================
   观看人数
========================= */

.views {
  width: min(100%, 520px);

  margin: 0 auto 13px;

  text-align: left;

  font-size: 15px;

  font-weight: 800;

  opacity: .92;
}

/* =========================
   音乐播放器
========================= */

.music-box {
  width: min(92vw, 650px);

  margin: 0 auto;

  padding: 18px;

  border-radius: 26px;

  background:
    rgba(255,255,255,0.04);

  border:
    1px solid rgba(255,255,255,0.18);

  box-shadow:
    0 0 12px rgba(255,255,255,0.05);

  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.player {
  width: 100%;

  margin: 0 auto;

  padding: 0;

  display: flex;

  align-items: center;

  gap: 14px;

  border-radius: 24px;

  background: transparent;

  border: 0;
}

.cover {
  width: 64px;
  height: 64px;

  border-radius: 15px;

  flex: 0 0 auto;

  background:
    linear-gradient(
      135deg,
      #060606,
      #555
    );

  display: grid;
  place-items: center;

  box-shadow:
    0 0 14px rgba(0,0,0,.28);

  overflow: hidden;
}

.cover img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  border-radius: 15px;
}

.track {
  flex: 1;

  min-width: 0;

  text-align: left;
}

.track-name {
  font-size: 16px;

  font-weight: 900;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.time-row {
  margin-top: 4px;

  font-size: 13px;

  opacity: .86;

  display: flex;

  justify-content: space-between;

  gap: 10px;
}

/* =========================
   音乐进度条
========================= */

.bar {
  margin-top: 7px;

  height: 5px;

  border-radius: 999px;

  background:
    rgba(255,255,255,.35);

  overflow: hidden;

  cursor: pointer;
}

.progress {
  width: 0%;
  height: 100%;

  border-radius: 999px;

  background: #fff;

  box-shadow:
    0 0 8px white;
}

/* =========================
   音乐按钮
========================= */

.music-btn {
  width: 40px;
  height: 40px;

  border: 0;

  background: transparent;

  color: #fff;

  font-size: 28px;

  cursor: pointer;

  filter:
    drop-shadow(0 0 6px white);
}

.prev-btn,
.next-btn {
  font-size: 24px;
}

/* =========================
   自定义鼠标
========================= */

body,
.enter,
a,
button,
.bar {
  cursor: none;
}

#customCursor {
  position: fixed;

  width: 24px;
  height: 24px;

  pointer-events: none;

  z-index: 999999;

  transform:
    translate(-50%, -50%);

  transition:
    transform .1s ease;
}

#customCursor::before,
#customCursor::after {
  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  background: white;

  box-shadow:
    0 0 8px white,
    0 0 18px #b300ff,
    0 0 30px #b300ff;
}

#customCursor::before {
  width: 2px;
  height: 24px;
}

#customCursor::after {
  width: 24px;
  height: 2px;
}

#customCursor.active {
  transform:
    translate(-50%, -50%)
    scale(1.5);
}

/* =========================
   动画
========================= */

@keyframes pulse {
  50% {
    opacity: .68;

    transform:
      scale(.98);
  }
}

@keyframes rise {
  from {
    opacity: 0;

    transform:
      translateY(18px)
      scale(.98);
  }

  to {
    opacity: 1;

    transform:
      translateY(0)
      scale(1);
  }
}

/* =========================
   手机
========================= */

@media (pointer: coarse) {
  #customCursor {
    display: none;
  }

  body,
  .enter,
  a,
  button,
  .bar {
    cursor: auto;
  }
}

@media (max-width: 520px) {

  .card {
    padding:
      30px 20px 22px;
  }

  .avatar {
    width: 110px;
    height: 110px;
  }

  h1 {
    font-size: 18px;
  }

  .player {
    gap: 10px;
  }

  .cover {
    width: 55px;
    height: 55px;
  }

  .socials {
    gap: 14px;
  }

  .music-btn {
    width: 34px;
  }
}
</style>
</head>

<script>

/* =========================
   获取元素
========================= */

const enter =
  document.getElementById("enter");

const music =
  document.getElementById("music");

const musicBtn =
  document.getElementById("musicBtn");

const nextBtn =
  document.getElementById("nextBtn");

const prevBtn =
  document.getElementById("prevBtn");

const progress =
  document.getElementById("progress");

const progressBar =
  document.getElementById("progressBar");

const current =
  document.getElementById("current");

const duration =
  document.getElementById("duration");

const viewCount =
  document.getElementById("viewCount");

const songName =
  document.getElementById("songName");

const coverImg =
  document.getElementById("coverImg");


/* =========================
   播放列表
========================= */

const playlist = [

  {
    name: "CAMO - Life is Wet",
    file: "music1.mp3",
    cover: "cover1.png"
  },

  {
    name: "Tlatre特雷西/LSGCsikoriot - 幻痛藥",
    file: "music2.mp3",
    cover: "cover2.png"
  },

  {
    name: "Rae Sremmurd - Not So Bad",
    file: "music3.mp3",
    cover: "cover3.png"
  },

  {
    name: "Majin - 歐洲貨",
    file: "music4.mp3",
    cover: "cover4.png"
  }

];

let currentSongIndex = 0;


/* =========================
   加载歌曲
========================= */

function loadSong(index) {

  const song = playlist[index];

  music.src = song.file;

  songName.textContent =
    song.name;

  coverImg.src =
    song.cover;

  current.textContent =
    "0:00";

  duration.textContent =
    "0:00";

  progress.style.width =
    "0%";

  music.load();
}


/* =========================
   播放歌曲
========================= */

async function playMusic() {

  try {

    await music.play();

    musicBtn.textContent =
      "❚❚";

  } catch (error) {

    console.error(
      "音乐播放失败：",
      error
    );

    musicBtn.textContent =
      "▶";
  }
}


/* =========================
   下一首
========================= */

async function nextSong() {

  currentSongIndex++;

  if (
    currentSongIndex >=
    playlist.length
  ) {
    currentSongIndex = 0;
  }

  loadSong(
    currentSongIndex
  );

  await playMusic();
}


/* =========================
   上一首
========================= */

async function previousSong() {

  currentSongIndex--;

  if (
    currentSongIndex < 0
  ) {
    currentSongIndex =
      playlist.length - 1;
  }

  loadSong(
    currentSongIndex
  );

  await playMusic();
}


/* 首次加载 */

loadSong(
  currentSongIndex
);


/* =========================
   点击进入
========================= */

enter.addEventListener(
  "click",
  async () => {

    enter.classList.add(
      "hide"
    );

    await playMusic();

  }
);


/* =========================
   播放 / 暂停
========================= */

musicBtn.addEventListener(
  "click",
  async () => {

    if (music.paused) {

      await playMusic();

    } else {

      music.pause();

      musicBtn.textContent =
        "▶";
    }

  }
);


/* =========================
   上一首
========================= */

prevBtn.addEventListener(
  "click",
  async () => {

    await previousSong();

  }
);


/* =========================
   下一首
========================= */

nextBtn.addEventListener(
  "click",
  async () => {

    await nextSong();

  }
);


/* =========================
   歌曲结束自动下一首
========================= */

music.addEventListener(
  "ended",
  async () => {

    await nextSong();

  }
);


/* =========================
   音乐资料加载
========================= */

music.addEventListener(
  "loadedmetadata",
  () => {

    duration.textContent =
      formatTime(
        music.duration
      );

  }
);


/* =========================
   音乐错误
========================= */

music.addEventListener(
  "error",
  () => {

    duration.textContent =
      "找不到歌曲";

    musicBtn.textContent =
      "▶";

    console.error(
      "找不到音乐文件：",
      music.src
    );

  }
);


/* =========================
   音乐进度
========================= */

music.addEventListener(
  "timeupdate",
  () => {

    current.textContent =
      formatTime(
        music.currentTime
      );

    if (
      Number.isFinite(
        music.duration
      ) &&
      music.duration > 0
    ) {

      const percent =
        (
          music.currentTime /
          music.duration
        ) * 100;

      progress.style.width =
        percent + "%";

      duration.textContent =
        formatTime(
          music.duration
        );
    }

  }
);


/* =========================
   点击进度条跳转
========================= */

progressBar.addEventListener(
  "click",
  (event) => {

    if (
      !Number.isFinite(
        music.duration
      ) ||
      music.duration <= 0
    ) {
      return;
    }

    const rect =
      progressBar
        .getBoundingClientRect();

    const clickX =
      event.clientX -
      rect.left;

    let percent =
      clickX /
      rect.width;

    percent =
      Math.max(
        0,
        Math.min(
          1,
          percent
        )
      );

    music.currentTime =
      percent *
      music.duration;

  }
);


/* =========================
   时间格式
========================= */

function formatTime(seconds) {

  if (
    !Number.isFinite(seconds) ||
    seconds < 0
  ) {
    return "0:00";
  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    Math.floor(
      seconds % 60
    )
      .toString()
      .padStart(
        2,
        "0"
      );

  return (
    minutes +
    ":" +
    secs
  );
}


/* =========================================
   观看人数
   基础人数：580
========================================= */

const BASE_VIEWS = 580;

viewCount.textContent =
  BASE_VIEWS.toLocaleString();


fetch(
  "https://api.counterapi.dev/v1/c91_chris_profile/views/up"
)

.then(response => {

  if (!response.ok) {

    throw new Error(
      "Counter API HTTP " +
      response.status
    );

  }

  return response.json();

})

.then(data => {

  console.log(
    "Counter API 回传：",
    data
  );

  /*
    CounterAPI 不同版本可能使用
    count 或 value。

  */

  const rawCount =
    data.count ??
    data.value ??
    0;

  const apiCount =
    Number(rawCount);

  if (

  ) {

    BASE_VIEWS.toLocaleString();

});


/* =========================
   雪花
========================= */

const canvas =
  document.getElementById(
    "snow"
  );

const ctx =
  canvas.getContext(
    "2d"
  );


function resizeSnow() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}

resizeSnow();

window.addEventListener(
  "resize",
  resizeSnow
);


/* 产生雪花 */

const flakes =
  Array.from(
    { length: 65 },
    () => ({

      x:
        Math.random() *
        canvas.width,

      y:
        Math.random() *
        canvas.height,

      r:
        Math.random() *
        2.2 + 1,

      speed:
        Math.random() *
        0.75 + 0.25,

      drift:
        Math.random() *
        0.55 + 0.15

    })
  );


/* 绘制雪花 */

function drawSnow() {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.fillStyle =
    "rgba(255,255,255,.76)";


  flakes.forEach(
    flake => {

      flake.y +=
        flake.speed;

      flake.x +=
        Math.sin(
          flake.y * 0.018
        ) *
        flake.drift;


      if (
        flake.y >
        canvas.height + 10
      ) {

        flake.y = -10;

        flake.x =
          Math.random() *
          canvas.width;

      }


      if (
        flake.x >
        canvas.width + 10
      ) {

        flake.x = -10;

      }


      if (
        flake.x < -10
      ) {

        flake.x =
          canvas.width + 10;

      }


      ctx.beginPath();

      ctx.arc(
        flake.x,
        flake.y,
        flake.r,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }
  );


  requestAnimationFrame(
    drawSnow
  );

}

drawSnow();


/* =========================
   自定义鼠标
========================= */

const customCursor =
  document.getElementById(
    "customCursor"
  );


document.addEventListener(
  "mousemove",
  event => {

    customCursor.style.left =
      event.clientX + "px";

    customCursor.style.top =
      event.clientY + "px";

  }
);


/* 鼠标经过按钮放大 */

document
  .querySelectorAll(
    "a, button, .enter, .bar"
  )
  .forEach(item => {

    item.addEventListener(
      "mouseenter",
      () => {

        customCursor
          .classList
          .add("active");

      }
    );


    item.addEventListener(
      "mouseleave",
      () => {

        customCursor
          .classList
          .remove("active");

      }
    );

  });


document.addEventListener(
  "mousedown",
  () => {

    customCursor
      .classList
      .add("active");

  }
);


document.addEventListener(
  "mouseup",
  () => {

    customCursor
      .classList
      .remove("active");

  }
);


/* =========================
   禁止右键
========================= */

document.addEventListener(
  "contextmenu",
  event => {

    event.preventDefault();

  }
);


/* =========================
   禁止部分快捷键
========================= */

document.addEventListener(
  "keydown",
  event => {

    const key =
      event.key
        .toLowerCase();


    if (

      (
        event.ctrlKey &&
        [
          "c",
          "a",
          "s",
          "u"
        ].includes(key)
      )

      ||

      event.key === "F12"

    ) {

      event.preventDefault();

    }

  }
);


/* =========================
   禁止拖动图片
========================= */

document.addEventListener(
  "dragstart",
  event => {

    event.preventDefault();

  }
);
