<!DOCTYPE html>

<meta charset="UTF-8" />

<title>꧁༺𖤍𓊈𝒞91_𝒞𝒽𝓇𝒾𝓈𓊉𖤍༻꧂</title>

<style>

body {
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
}

img {
  pointer-events: none;
  -webkit-user-drag: none;
}

* { box-sizing: border-box; }

:root {
  --glass: rgba(255,255,255,.16);
  --glass-border: rgba(255,255,255,.25);
  --glow: 0 0 10px rgba(255,255,255,.9), 0 0 22px rgba(255,255,255,.55);
}

html, body { margin: 0; min-height: 100%; }

body {
  min-height: 100vh;
  overflow: hidden;
  font-family: "Segoe UI", Arial, sans-serif;
  color: #fff;
  background:
    linear-gradient(rgba(0,0,0,.32), rgba(0,0,0,.32)),
    url("background.gif") center / cover no-repeat fixed;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.05);
  backdrop-filter: blur(.5px);
  -webkit-backdrop-filter: blur(1.4px) grayscale(.25);
  z-index: 0;
}

#snow {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.enter {
  position: fixed;
  inset: 0;
  z-index: 99;
  display: grid;
  place-items: center;
  background: rgba(0,0,0,.92);
  cursor: pointer;
  transition: .7s ease;
}

.enter h2 {
  margin: 0;
  font-size: clamp(22px, 5vw, 36px);
  letter-spacing: 4px;
  font-family: Georgia, serif;
  font-style: italic;
  text-shadow: var(--glow);
  animation: pulse 1.7s ease-in-out infinite;
}

.enter.hide { opacity: 0; pointer-events: none; }

.wrap {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 22px;
}

.card {
  width: min(92vw, 650px);
  padding: 38px 34px 26px;
  border-radius: 30px;
  text-align: center;

  background: rgba(255,255,255,0.06);

  border: 1.5px solid rgba(255,255,255,0.25);

  box-shadow:
    0 0 25px rgba(255,255,255,0.08),
    inset 0 0 20px rgba(255,255,255,0.03);

  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);

  animation: rise .9s ease both;
}

.avatar {
  width: 124px;
  height: 124px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 40% 30%, rgba(165,70,255,.85), transparent 24%),
    linear-gradient(135deg, #050505, #4b4b4b);
  border: 4px solid rgba(255,255,255,.65);
  box-shadow: 0 0 28px rgba(255,255,255,.65);
  display: grid;
  place-items: center;
  font-size: 50px;
  position: relative;
  overflow: hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

h1 {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: clamp(15px, 2.2vw, 22px);
  letter-spacing: .5px;
  line-height: 1.15;
  text-shadow: var(--glow);
  word-break: keep-all;
}

.divider {
  font-size: 26px;
  margin: 14px 0 18px;
  color: #fff;
  filter:
    drop-shadow(0 0 10px white)
    drop-shadow(0 0 20px #b300ff);
}

.title {
  margin: 0 0 18px;
  font-size: 20px;
  font-weight: 800;
  text-shadow: 0 0 10px rgba(0,0,0,.45);
}

.location {
  margin: 0 0 20px;
  font-weight: 800;
  text-shadow: 0 0 8px rgba(0,0,0,.4);
}

.status-card {
  width: fit-content;

  max-width: 340px;

  margin: 0 auto 26px;

  padding: 13px 18px;

  display: flex;
  align-items: center;
  gap: 12px;

  background: rgba(255,255,255,0.08);

  border: 1px solid rgba(255,255,255,0.20);

  border-radius: 22px;

  backdrop-filter: blur(6px);
}

.status-card:hover{
  border-color: rgba(255,255,255,0.35);
  box-shadow:
    0 0 20px rgba(255,255,255,0.10);
}

.mini-avatar {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  flex: 0 0 auto;
  background: radial-gradient(circle at 40% 35%, #444, #050505 70%);
  display: grid;
  place-items: center;
  font-size: 25px;
  position: relative;
}

.mini-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
}

.mini-avatar::after {
  content: "";
  position: absolute;
  right: 1px;
  bottom: 1px;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #20d66f;
  border: 2px solid rgba(255,255,255,.8);
}

.status-text {
  text-align: left;
  line-height: 1.28;
  min-width: 0;
}

.status-text b {
  display: block;
  font-size: 12px;
  word-break: break-all;
  margin-bottom: 4px;
}

.badge {
  margin-left: 4px;
  font-size: 12px;
}

.status-text span {
  display: block;
  font-size: 13px;
  opacity: .92;
}

.socials {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 23px;
}

.socials a {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  color: #fff;
  text-decoration: none;
  filter: drop-shadow(0 0 8px rgba(255,255,255,.9));
  transition: .2s ease;
}

.socials a:hover { transform: translateY(-4px) scale(1.14); }

.socials svg {
  width: 27px;
  height: 27px;
  fill: currentColor;
}

.views {
  width: min(100%, 520px);
  margin: 0 auto 13px;
  text-align: left;
  font-size: 15px;
  font-weight: 800;
  opacity: .92;
}

.music-box {
  width: min(92vw, 650px);
  margin: 0 auto;

  padding: 18px;

  border-radius: 26px;

  background: rgba(255,255,255,0.04);

  border: 1px solid rgba(255,255,255,0.18);

  box-shadow:
    0 0 12px rgba(255,255,255,0.05);

  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.player {
  width: 100%;
  margin: 0 auto;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 14px;
  border-radius: 24px;
  background: transparent;
  border: 0;
}

.cover {
  width: 64px;
  height: 64px;
  border-radius: 15px;
  flex: 0 0 auto;
  background: linear-gradient(135deg, #060606, #555);
  display: grid;
  place-items: center;
  font-size: 29px;
  box-shadow: 0 0 14px rgba(0,0,0,.28);
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:15px;
}

.track { flex: 1; min-width: 0; text-align: left; }

.track-name {
  font-size: 16px;
  font-weight: 900;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.time-row {
  margin-top: 4px;
  font-size: 13px;
  opacity: .86;
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.bar {
  margin-top: 7px;
  height: 5px;
  border-radius: 999px;
  background: rgba(255,255,255,.35);
  overflow: hidden;
}

.progress {
  width: 0%;
  height: 100%;
  border-radius: 999px;
  background: #fff;
  box-shadow: 0 0 8px white;
}

.music-btn {
  width: 40px;
  height: 40px;
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 28px;
  cursor: pointer;
  filter: drop-shadow(0 0 6px white);
}

.hint {
  margin: 12px 0 0;
  font-size: 12px;
  opacity: .68;
}

body,
.enter,
a,
button {
  cursor: none;
}

#customCursor{
    position:fixed;
    width:24px;
    height:24px;
    pointer-events:none;
    z-index:999999;
    transform:translate(-50%,-50%);
}

#customCursor::before,
#customCursor::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:white;
    box-shadow:
    0 0 8px white,
    0 0 18px #b300ff,
    0 0 30px #b300ff;
}

#customCursor::before{
    width:2px;
    height:24px;
}

#customCursor::after{
    width:24px;
    height:2px;
}

#customCursor.active{
    transform:translate(-50%,-50%) scale(1.5);
}

@media (pointer: coarse) {

  #customCursor {
    display: none;
  }

  body,
  .enter,
  a,
  button {
    cursor: auto;
  }

}

@keyframes pulse { 50% { opacity: .68; transform: scale(.98); } }

@keyframes rise {
  from { opacity: 0; transform: translateY(18px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 520px) {
  .card { padding: 30px 20px 22px; }
  .avatar { width: 110px; height: 110px; font-size: 45px; }
  h1 { font-size: 18px; }
  .player { padding: 12px; gap: 10px; }
  .cover { width: 55px; height: 55px; }
  .socials { gap: 14px; }
}
</style>
</head>

<script>
const enter = document.getElementById("enter");
const music = document.getElementById("music");
const musicBtn = document.getElementById("musicBtn");
const progress = document.getElementById("progress");
const current = document.getElementById("current");
const duration = document.getElementById("duration");
const viewCount = document.getElementById("viewCount");

enter.addEventListener("click", async () => {
  enter.classList.add("hide");

  try {
    await music.play();
    musicBtn.textContent = "❚❚";
  } catch {
    musicBtn.textContent = "▶";
  }
});

musicBtn.addEventListener("click", async () => {
  if (music.paused) {
    try {
      await music.play();
      musicBtn.textContent = "❚❚";
    } catch {
      alert("找不到歌曲，請確認 music.mp3 跟 index.html 放在同一個資料夾。");
    }
  } else {
    music.pause();
    musicBtn.textContent = "▶";
  }
});

music.addEventListener("loadedmetadata", () => {
  duration.textContent = formatTime(music.duration);
});

music.addEventListener("error", () => {
  duration.textContent = "找不到歌曲";
  musicBtn.textContent = "▶";
});

music.addEventListener("timeupdate", () => {
  current.textContent = formatTime(music.currentTime);

  if (music.duration) {
    progress.style.width = ((music.currentTime / music.duration) * 100) + "%";
    duration.textContent = formatTime(music.duration);
  }
});

function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return "0:00";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60).toString().padStart(2, "0");
  return m + ":" + s;
}

fetch("https://api.countapi.xyz/hit/c91-chris/views")
  .then(res => res.json())
  .then(data => {
    viewCount.textContent = 580 + data.value;
  })
  .catch(() => {
    viewCount.textContent = "580";
  });
// 雪花
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}

resize();
addEventListener("resize", resize);

const flakes = Array.from({ length: 65 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 2.2 + 1,
  speed: Math.random() * 0.75 + 0.25,
  drift: Math.random() * 0.55 + 0.15
}));

function drawSnow() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "rgba(255,255,255,.76)";

  flakes.forEach(f => {
    f.y += f.speed;
    f.x += Math.sin(f.y * 0.018) * f.drift;

    if (f.y > canvas.height + 10) {
      f.y = -10;
      f.x = Math.random() * canvas.width;
    }

    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(drawSnow);
}

drawSnow();

const customCursor = document.getElementById("customCursor");

document.addEventListener("mousemove", (e) => {
  customCursor.style.left = e.clientX + "px";
  customCursor.style.top = e.clientY + "px";
});

document.querySelectorAll("a, button, .enter").forEach(item => {
  item.addEventListener("mouseenter", () => {
    customCursor.classList.add("active");
  });

  item.addEventListener("mouseleave", () => {
    customCursor.classList.remove("active");
  });
});

document.addEventListener("mousedown", () => {
  customCursor.classList.add("active");
});

document.addEventListener("mouseup", () => {
  customCursor.classList.remove("active");
});

// 禁止右鍵
document.addEventListener("contextmenu", e => {
  e.preventDefault();
});

// 禁止 Ctrl+C、Ctrl+A、Ctrl+S、Ctrl+U
document.addEventListener("keydown", e => {
  if (
    (e.ctrlKey && ["c", "a", "s", "u"].includes(e.key.toLowerCase())) ||
    e.key === "F12"
  ) {
    e.preventDefault();
  }
});

// 禁止拖曳圖片
document.addEventListener("dragstart", e => {
  e.preventDefault();
});

</script>
